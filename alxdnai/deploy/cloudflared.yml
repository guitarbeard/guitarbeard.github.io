# Installed as /etc/cloudflared/config.yml with TUNNEL_ID filled in (see alxdnai/README.md).
tunnel: TUNNEL_ID
credentials-file: /etc/cloudflared/TUNNEL_ID.json
ingress:
  - hostname: ai.alxdna.dev
    service: http://127.0.0.1:8787
    originRequest:
      # Answers stream for a while on a CPU-only box.
      connectTimeout: 30s
      keepAliveTimeout: 120s
  - service: http_status:404
